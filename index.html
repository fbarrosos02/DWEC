<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Arrastra las palabras a sus categorías </h1>
    <div class="cont">
        <div class="dropzone" id="frutas">Frutas</div>
        <div class="dropzone" id="animales">Animales</div>
        <div class="dropzone" id="colores">Colores</div>
    </div>
    <div class="cont">
        <div class="draggable" draggable="true" id="manzana">Manzana</div>
        <div class="draggable" draggable="true" id="perro">Perro</div>
        <div class="draggable" draggable="true" id="rojo">Rojo</div>
        <div class="draggable" draggable="true" id="platano">Plátano</div>
        <div class="draggable" draggable="true" id="gato">Gato</div>
        <div class="draggable" draggable="true" id="azul">Azul</div>
        <div class="draggable" draggable="true" id="uva">Uva</div>
        <div class="draggable" draggable="true" id="caballo">Caballo</div>
        <div class="draggable" draggable="true" id="amarillo">Amarillo</div>
        <div class="draggable" draggable="true" id="kiwi">Kiwi</div>
    </div>
    <button id="btncomprobar">Comprobar</button>

    <script src="script.js"></script>
</body>

</html>
