<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Mejorado</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Trello Mejorado</h1>
    <div id="entrada">
        <input type="text" id="entradatexto">
        <button id="btnenviar">Agregar Tarea</button>
    </div>

    <div id="modos">
        <button id="claro">☀️Claro</button>
        <button id="oscuro">🌙Oscuro</button>
        <button id="pastel">🎂Pastel</button>
    </div>
    <div id="tareas">
        <div class="dropzone" id="pendiente">
            <p>Pendiente</p>
        </div>
        <div class="dropzone" id="en-progreso">
            <p>En Progreso</p>
        </div>
        <div class="dropzone" id="completado">
            <p>Completado</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
